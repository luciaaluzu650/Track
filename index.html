<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenos</title>
<meta name="description" content="Registro de entrenamientos de gimnasio y actividades">
<meta name="theme-color" content="#F7F5F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #F7F5F0; --surface: #FFFFFF; --surface2: #EFECE6; --line: #E6E2DA; --ink: #1C1B19; --mute: #7A766F;
  --accent: #1C1B19; --accent-soft: #EFECE6;
  --rosa: #F6DDE0; --rosa-ink: #9E4B57; --melo: #FBE3D0; --melo-ink: #A85E2E; --amar: #F8EBC3; --amar-ink: #8A6B14;
  --verde: #DCEBD9; --verde-ink: #3E6B47; --azul: #D9E6F2; --azul-ink: #3D5F80; --lila: #E5DFF2; --lila-ink: #5E4E8A;
  --teal: var(--azul-ink); --teal-soft: var(--azul); --teal-light: var(--azul);
  --food: var(--amar-ink); --food-soft: var(--amar); --food-light: var(--amar);
  --m-kcal: var(--ink); --m-prot: var(--azul-ink); --m-fat: var(--melo-ink); --m-carb: var(--amar-ink); --m-fib: var(--verde-ink);
  --ok: var(--verde-ink); --danger: var(--rosa-ink); --r: 14px; --rs: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums;
  overscroll-behavior-y: none;
}
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rs); padding: 11px 12px; width: 100%; min-width: 0; font-size: 16px; }
.card input, .card select { background: var(--bg); }
input::placeholder { color: var(--mute); opacity: .7; }
select { appearance: none; -webkit-appearance: none; padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--mute) 50%), linear-gradient(135deg, var(--mute) 50%, transparent 50%);
  background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input:focus, select:focus { border-color: var(--ink); outline: none; }
.i { display: inline-block; vertical-align: middle; flex: 0 0 auto; }
#app { max-width: 480px; margin: 0 auto; padding: calc(4px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom)); }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 0 12px; }
.top h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
.top h1 span { color: var(--mute); font-weight: 400; }
.nav { display: flex; align-items: center; gap: 6px; }
.ib { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
.ib:active { background: var(--surface2); }
.ib.plain { background: none; border: 0; color: var(--mute); }
.tb { color: var(--ink); font-weight: 600; font-size: 14px; padding: 8px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.tb:active { background: var(--surface2); }

.wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; color: var(--mute); font-size: 12px; font-weight: 500; text-align: center; margin-bottom: 4px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { aspect-ratio: 1; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 500; }
.day.blank { background: none; border: 0; }
.day.today { border-color: var(--ink); }
.day.today .n { font-weight: 700; }
.day.sel { background: var(--ink); border-color: var(--ink); }
.day.sel .n { color: #fff; }
.day .n { line-height: 1; }
.mks { display: flex; gap: 3px; height: 6px; }
.mk { display: block; width: 6px; height: 6px; border-radius: 50%; }
.mk.g { background: var(--rosa-ink); } .mk.c { background: var(--azul-ink); } .mk.f { background: var(--amar-ink); }
.day.sel .mk.g { background: var(--rosa); } .day.sel .mk.c { background: var(--azul); } .day.sel .mk.f { background: var(--amar); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.list .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); color: var(--ink); }
.list .row:last-child { border-bottom: 0; }
.list button.row:active { background: var(--bg); }
.list .row > .i:last-child { color: var(--mute); }
.rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rt b { font-weight: 600; font-size: 15px; }
.rt small { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ic { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ic.g { background: var(--rosa); color: var(--rosa-ink); }
.ic.c { background: var(--azul); color: var(--azul-ink); }
.ic.f { background: var(--amar); color: var(--amar-ink); }
.thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--mute); overflow: hidden; flex: 0 0 auto; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.big { width: 56px; height: 56px; }

.detail { margin-top: 22px; }
.detail h2, .sec h2, .h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
.h2 { margin: 18px 0 10px; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; }
.btnrow .btn { flex: 1; min-width: 0; padding-left: 10px; padding-right: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: var(--rs); font-weight: 600; font-size: 15px; background: var(--ink); color: #fff; line-height: 1.2; border: 1px solid var(--ink); }
.btn:active { opacity: .85; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.secondary:active { background: var(--surface2); opacity: 1; }
.btn.danger { color: var(--rosa-ink); }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn.small { padding: 8px 12px; font-size: 14px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 26px 18px; color: var(--mute); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { color: var(--ink); font-weight: 600; font-size: 15px; margin-top: 4px; }
.empty span { font-size: 14px; max-width: 30ch; }
.note { color: var(--mute); font-size: 13px; margin: 14px 2px 0; text-align: center; }
.banner { background: var(--lila); color: var(--ink); border-radius: var(--rs); padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
.banner.install { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; background: var(--surface2); }
.banner.install > div { flex: 1; }
.banner.install small { color: var(--mute); font-size: 13px; display: block; margin-top: 2px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
.tabs button { flex: 1; max-width: 130px; padding: 9px 0 8px; font-size: 11px; font-weight: 500; color: var(--mute); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button .ti { display: flex; align-items: center; justify-content: center; }
.tabs button.on { color: var(--ink); font-weight: 600; }

#sheet, #sheet2 { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
#sheet { z-index: 20; } #sheet2 { z-index: 25; }
#sheet[hidden], #sheet2[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { #sheet, #sheet2 { animation: up .16s ease-out; } }
@keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.sh { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.sh-h { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 16px 12px; z-index: 1; }
.sh-h h2 { margin: 0; font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-b { padding: 4px 16px 16px; flex: 1; }
.sh-f { position: sticky; bottom: 0; background: var(--bg); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 500; color: var(--mute); margin-bottom: 6px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meta { color: var(--mute); font-size: 13px; margin: 8px 2px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg { display: flex; background: var(--surface2); border-radius: var(--rs); padding: 3px; margin: 4px 0 14px; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--mute); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; border: 1px solid var(--line); }

.ex { padding: 12px; margin-bottom: 10px; }
.ex-h { display: flex; gap: 8px; align-items: center; }
.ex-h input { font-weight: 600; padding: 9px 10px; }
.cols, .set { display: grid; grid-template-columns: 26px 1fr 16px 1fr 32px; align-items: center; column-gap: 4px; }
.cols { color: var(--mute); font-size: 12px; font-weight: 500; text-align: center; margin: 6px 0 6px; }
.set { margin-bottom: 6px; }
.sn { width: 24px; height: 24px; border-radius: 50%; background: var(--surface2); color: var(--mute); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.x { text-align: center; color: var(--mute); font-size: 13px; }
.stp { display: flex; align-items: stretch; height: 42px; border: 1px solid var(--line); border-radius: var(--rs); background: var(--surface); overflow: hidden; }
.stp button { width: 34px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.stp button:active { background: var(--surface2); }
.stp input { border: 0; border-radius: 0; text-align: center; padding: 0 2px; font-weight: 600; font-size: 17px; flex: 1; background: transparent; }
.set .ib.plain { width: 32px; height: 42px; }
.addset { margin: 4px 0 0 -4px; }

.photo { aspect-ratio: 4 / 3; border-radius: var(--r); background: var(--surface2); border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--mute); margin-bottom: 10px; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; text-align: center; padding: 16px; }
.mcard { margin: 0 0 14px; }

.chart { padding: 12px 8px 4px; }
.chart svg { width: 100%; height: auto; display: block; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--mute); }
.hist .row { justify-content: space-between; }
.hist .d { color: var(--mute); font-size: 13px; line-height: 1.3; white-space: nowrap; }
.hist .d b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.hist .sets { font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: flex-end; }

.kcal { padding: 16px; margin-bottom: 10px; }
.kcal .lab { font-size: 13px; color: var(--mute); font-weight: 500; }
.kcal b { display: block; font-size: 36px; font-weight: 700; line-height: 1.1; margin: 2px 0; }
.kcal b.over { color: var(--rosa-ink); }
.kcal small { font-size: 13px; color: var(--mute); }
.track { background: var(--surface2); border-radius: 999px; height: 6px; overflow: hidden; margin-top: 10px; }
.card.kcal .track { background: var(--surface2); }
.fill { height: 100%; border-radius: 999px; }
.stat.mt { border: 0; }
.stat.mt .ml { display: block; font-size: 13px; font-weight: 600; }
.stat.mt b { font-size: 18px; font-weight: 700; margin-top: 2px; line-height: 1.2; }
.stat.mt .track { background: rgba(255, 255, 255, .7); margin-top: 8px; }
.stat.mt small { display: block; margin-top: 6px; font-size: 12px; font-weight: 500; }
.stat.m-p { background: var(--azul); color: var(--azul-ink); } .stat.m-p .fill { background: var(--azul-ink); }
.stat.m-c { background: var(--amar); color: var(--amar-ink); } .stat.m-c .fill { background: var(--amar-ink); }
.stat.m-f { background: var(--melo); color: var(--melo-ink); } .stat.m-f .fill { background: var(--melo-ink); }
.stat.m-fi { background: var(--verde); color: var(--verde-ink); } .stat.m-fi .fill { background: var(--verde-ink); }
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.dn { flex: 1; text-align: center; min-width: 0; }
.dn b { display: block; font-weight: 700; font-size: 16px; line-height: 1.2; }
.dn small { color: var(--mute); font-size: 13px; }
.seg.meals button { font-size: 13px; padding: 8px 2px; }
.opt { padding: 14px; margin-bottom: 10px; }
.opt > b { font-size: 15px; font-weight: 600; display: block; }
.opt .mac { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.opt ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.opt li { margin: 2px 0; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.setup { padding: 16px; }
.setup b { font-size: 16px; font-weight: 700; }
.setup .meta { margin: 6px 0 12px; }

#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; z-index: 40; max-width: 90vw; text-align: center; }
#toast[hidden] { display: none; }
#confirm { position: fixed; inset: 0; background: rgba(28, 27, 25, .4); z-index: 45; display: flex; align-items: flex-end; justify-content: center; padding: 14px; }
#confirm[hidden] { display: none; }
.cb { background: var(--surface); border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; margin-bottom: env(safe-area-inset-bottom); }
.cb p { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
.cb-a { display: flex; gap: 8px; }
.cb-a .btn { flex: 1; }
.btn.red { background: var(--rosa-ink); border-color: var(--rosa-ink); color: #fff; }
#file, #importfile { display: none; }
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav class="tabs" aria-label="Secciones"></nav>
<div id="sheet" hidden></div>
<div id="sheet2" hidden></div>
<div id="confirm" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="file" accept="image/*">
<input type="file" id="importfile" accept=".json,application/json">
<datalist id="exlist"></datalist>

<script>
(() => {
'use strict';

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => (Number(n) || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const parseN = s => { if (typeof s === 'number') return s; const v = parseFloat(String(s == null ? '' : s).trim().replace(',', '.')); return isFinite(v) ? v : 0; };
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => toISO(new Date());
const fromISO = iso => { const p = String(iso || '').split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLabel = iso => cap(new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(fromISO(iso)));
const shortDate = iso => new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' }).format(fromISO(iso)).replace('.', '');
const monthName = (y, m) => cap(new Intl.DateTimeFormat('es-ES', { month: 'long' }).format(new Date(y, m, 1)));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const setsStr = sets => sets.map(s => s.reps + '×' + fmtN(s.weight)).join('\u2003');
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
function machineId(name) {
  let s = norm(name).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
  if (!s) { let h = 5381; for (const ch of norm(name)) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0; s = 'm-' + h.toString(36); }
  return s;
}

const ICONS = {
  cal: '<rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  dumb: '<path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  camera: '<path d="M4 8.5A2.5 2.5 0 016.5 6H8l1.6-2.2h4.8L16 6h1.5A2.5 2.5 0 0120 8.5v8a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 16.5z"/><circle cx="12" cy="12.5" r="3.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  run: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  img: '<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M4 19h16"/>',
  up: '<path d="M12 15V4M7 9l5-5 5 5M4 19h16"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
  food: '<path d="M12 7c-1.4-1.6-3.6-2-5.3-.8C4 7.9 3.6 12 5.6 15.5 7.2 18.3 9.3 20 11 19.6c.6-.1 1.4-.1 2 0 1.7.4 3.8-1.3 5.4-4.1 2-3.5 1.6-7.6-1.1-9.3C15.6 5 13.4 5.4 12 7z"/><path d="M12 7c0-2 1.2-3.2 2.8-3.6"/>'
};
const ico = (n, s = 20) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const COLS = ['sessions', 'activities', 'machines', 'food', 'prefs'];
const IDB = {

    return new Promise((res, rej) => {

      const r = indexedDB.open('entrenos', 2);
      r.onupgradeneeded = () => { const db = r.result; for (const s of COLS.concat('photos')) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error || new Error('tx')); t.onabort = () => rej(t.error || new Error('abort'));
    });
  },
  getAll(store) { return this.tx(store, 'readonly', st => st.getAll()); },
  put(store, obj) { return this.tx(store, 'readwrite', st => st.put(obj)); },

};
const LS_KEY = 'entrenos_v1';

const store = {

// ---------- progreso ----------
function niceStep(range) { const st = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000]; for (const s of st) if (range / s <= 5) return s; return 50000; }
function chartSVG(vals, dates, metric) {
  const W = 340, H = 200, L = 42, R = 16, T = 24, B = 30, n = vals.length;
  const max = Math.max(...vals), min = Math.min(...vals);
  let lo = 0;
  if (metric === 'max') { lo = max === min ? Math.max(0, min - 10) : Math.max(0, min - (max - min) * 0.5); lo = Math.floor(lo / 5) * 5; }
  const range = Math.max(max - lo, 1);
  const step = niceStep(range);
  let hi = lo + Math.ceil(range / step) * step; if (hi <= max) hi += step;
  const px = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  const py = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let grid = '';
  for (let v = lo; v <= hi + 1e-9; v += step) { const yy = py(v).toFixed(1); grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${(py(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mute)">${fmtN(v)}</text>`; }
  const pts = vals.map((v, i) => [px(i), py(v)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = n > 1 ? `<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9E6F2" stop-opacity=".9"/><stop offset="1" stop-color="#D9E6F2" stop-opacity="0"/></linearGradient></defs><path d="${path} L${pts[n - 1][0].toFixed(1)} ${(H - B).toFixed(1)} L${pts[0][0].toFixed(1)} ${(H - B).toFixed(1)} Z" fill="url(#area)"/>` : '';
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`).join('');
  const li = n <= 4 ? vals.map((_, i) => i) : [0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1];
  const xl = li.map(i => `<text x="${px(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--mute)">${shortDate(dates[i])}</text>`).join('');
  const last = pts[n - 1];
  const lastLbl = `<text x="${last[0].toFixed(1)}" y="${(last[1] - 10).toFixed(1)}" text-anchor="${n === 1 ? 'middle' : 'end'}" font-size="12" font-weight="600" fill="var(--ink)">${fmtN(vals[n - 1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de progreso">${grid}${area}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}${lastLbl}</svg>`;
}

function dayFoodHTML(goals) {

  const tiles = MACROS.map(m => {
    const goal = goals[m.key] || 0, v = t[m.key], p = goal ? Math.min(100, v / goal * 100) : 0;

// --- sesión de gimnasio ---
function routinePicker(date) {
  pendingDate = date;
  const rs = routines();
  const chips = (rs.length ? rs : SUG_ROUT).map(r => `<button class="chip" data-act="pick-r" data-r="${esc(r)}">${esc(r)}</button>`).join('');
  openSheet(`<div class="sh"><header class="sh-h"><h2>¿Qué rutina?</h2>${closeBtn('close')}</header>
<div class="sh-b">
<p class="meta">${rs.length ? 'Elige una y se cargan los ejercicios y pesos de la última vez.' : 'Todavía no tienes rutinas. Elige un nombre o escribe el tuyo.'}</p>
<div class="chips">${chips}</div>
<label class="field"><span>${rs.length ? 'O crea una nueva' : 'Otro nombre'}</span><input id="newr" placeholder="Pierna, empuje, tirón…" autocomplete="off" enterkeyhint="go"></label>
<button class="btn block" data-act="pick-new">Empezar sesión</button>
</div></div>`);
}
function startSession(routine) {
  const last = lastSessionOf(routine, null);
  ed = { id: null, date: pendingDate || todayISO(), routine: last ? last.routine : routine, createdAt: null, exercises: last ? clone(last.exercises) : [{ name: '', sets: [{ reps: 10, weight: 0 }] }], prefilledFrom: last ? last.date : null };
  openSheet(editorHTML());
  if (!last) focusLastName();
}
function openEditor(s) {
  ed = { id: s.id, date: s.date, routine: s.routine, createdAt: s.createdAt || null, exercises: clone(s.exercises || []), prefilledFrom: null };
  openSheet(editorHTML());
}
function editorHTML() {
  return `<div class="sh"><header class="sh-h"><h2>${ed.id ? 'Editar sesión' : 'Nueva sesión'}</h2>${closeBtn('close')}</header>
<div class="sh-b">
<div class="row2"><label class="field"><span>Rutina</span><input data-bind="routine" value="${esc(ed.routine)}" placeholder="Pierna" autocomplete="off"></label>
<label class="field"><span>Fecha</span><input type="date" data-bind="date" value="${esc(ed.date)}"></label></div>
${ed.prefilledFrom ? `<div class="banner">Cargado de tu última sesión de ${esc(ed.routine)} (${shortDate(ed.prefilledFrom)}). Cambia lo que quieras.</div>` : ''}
<div id="exs">${exListHTML()}</div>
<button class="btn secondary block" data-act="addex">${ico('plus', 18)}Añadir ejercicio</button>
</div>
<footer class="sh-f">${ed.id ? `<button class="btn secondary danger" data-act="del-s">${ico('trash', 18)}</button>` : ''}<button class="btn grow" data-act="save-s">Guardar sesión</button></footer></div>`;
}
function exListHTML() { return ed.exercises.map((ex, i) => exHTML(ex, i)).join(''); }
function exHTML(ex, i) {
  const last = ex.name.trim() ? lastExercise(ex.name, ed.id) : null;
  const m = ex.name.trim() ? machineFor(ex.name) : null;
  const hint = last ? 'Última vez, ' + shortDate(last.session.date) + ': ' + setsStr(last.ex.sets) : (ex.name.trim() ? 'Primera vez con este ejercicio' : '');
  return `<section class="card ex" data-exsec="${i}">
<div class="ex-h"><button class="thumb" data-act="machine" data-ex="${i}" aria-label="Foto y ajustes de la máquina">${photoSrc(m) ? `<img src="${esc(photoSrc(m))}" alt="">` : ico('camera', 20)}</button><input list="exlist" data-bind="name" data-ex="${i}" value="${esc(ex.name)}" placeholder="Ejercicio" autocomplete="off"><button class="ib plain" data-act="delex" data-ex="${i}" aria-label="Quitar ejercicio">${ico('trash', 20)}</button></div>
${hint ? `<p class="meta">${esc(hint)}${m && m.settings ? ' · ' + esc(m.settings) : ''}</p>` : ''}
<div class="cols"><span></span><span>Reps</span><span></span><span>Kg</span><span></span></div>
${ex.sets.map((s, j) => setRowHTML(s, i, j)).join('')}
<button class="tb addset" data-act="addset" data-ex="${i}">${ico('plus', 16)}Añadir serie</button>
</section>`;
}
function setRowHTML(s, i, j) {
  const a = `data-ex="${i}" data-set="${j}"`;
  return `<div class="set"><span class="sn">${j + 1}</span>
<div class="stp"><button data-act="step" ${a} data-f="reps" data-d="-1" aria-label="Menos repeticiones">${ico('minus', 18)}</button><input inputmode="numeric" enterkeyhint="done" data-bind="reps" ${a} value="${s.reps}" aria-label="Repeticiones"><button data-act="step" ${a} data-f="reps" data-d="1" aria-label="Más repeticiones">${ico('plus', 18)}</button></div>
<span class="x">×</span>
<div class="stp"><button data-act="step" ${a} data-f="weight" data-d="${-WSTEP}" aria-label="Menos peso">${ico('minus', 18)}</button><input inputmode="decimal" enterkeyhint="done" data-bind="weight" ${a} value="${fmtN(s.weight)}" aria-label="Kilos"><button data-act="step" ${a} data-f="weight" data-d="${WSTEP}" aria-label="Más peso">${ico('plus', 18)}</button></div>
<button class="ib plain" data-act="delset" ${a} aria-label="Quitar serie">${ico('x', 18)}</button></div>`;
}
function rerenderEx(only) {
  if (!ed || sheet.hidden) return;
  if (only != null) { const sec = sheet.querySelector(`.ex[data-exsec="${only}"]`); if (sec && ed.exercises[only]) { sec.outerHTML = exHTML(ed.exercises[only], only); return; } }
  const st = sheet.scrollTop; const c = $('#exs'); if (c) c.innerHTML = exListHTML(); sheet.scrollTop = st;
}
function focusLastName() { const ins = sheet.querySelectorAll('input[data-bind="name"]'); const el = ins[ins.length - 1]; if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); } }
function step(i, j, f, d) {
  const s = ed.exercises[i] && ed.exercises[i].sets[j]; if (!s) return;
  let v = (Number(s[f]) || 0) + d;
  v = Math.max(0, f === 'reps' ? Math.round(v) : Math.round(v * 100) / 100);
  s[f] = v;
  const inp = sheet.querySelector(`input[data-bind="${f}"][data-ex="${i}"][data-set="${j}"]`);
  if (inp) inp.value = f === 'reps' ? String(v) : fmtN(v);
}
async function saveSession(btn) {
  const s = {
    id: ed.id || uid('s_'), date: ed.date || todayISO(), routine: (ed.routine || '').trim() || 'Sesión', createdAt: ed.createdAt || Date.now(),
    exercises: ed.exercises.map(e => ({ name: (e.name || '').trim(), sets: e.sets.filter(x => x.reps > 0 || x.weight > 0).map(x => ({ reps: Number(x.reps) || 0, weight: Number(x.weight) || 0 })) })).filter(e => e.name && e.sets.length)
  };
  if (!s.exercises.length) return toast('Añade al menos un ejercicio con series');
  const done = busy(btn, 'Guardando…');
  try { await store.put('sessions', s); } catch (e) { console.error(e); done(); return toast(errMsg(e)); }
  state.sel = s.date; setMonthTo(s.date); state.view = 'cal';
  closeSheet(); render(); toast('Sesión guardada');
}

// --- actividad ---

  const chips = ACT_TYPES.map(t => `<button class="chip${t === act.type ? ' on' : ''}" data-act="type" data-t="${t}">${t}</button>`).join('');
  openSheet(`<div class="sh"><header class="sh-h"><h2>${act.id ? 'Editar actividad' : 'Actividad'}</h2>${closeBtn('close')}</header>
<div class="sh-b">
<div class="chips">${chips}</div>
<div class="row2"><label class="field"><span>Fecha</span><input type="date" data-bind="date" value="${esc(act.date)}"></label>
<label class="field"><span>Minutos (opcional)</span><input inputmode="numeric" data-bind="minutes" value="${act.minutes || ''}" placeholder="30"></label></div>
<label class="field"><span>Nota (opcional)</span><input data-bind="note" value="${esc(act.note)}" placeholder="8 km por el parque"></label>
</div>
<footer class="sh-f">${act.id ? `<button class="btn secondary danger" data-act="del-a">${ico('trash', 18)}</button>` : ''}<button class="btn grow" data-act="save-a">Guardar</button></footer></div>`);
}
async function saveActivity(btn) {
  const a = { id: act.id || uid('a_'), date: act.date || todayISO(), type: act.type, minutes: Number(act.minutes) || 0, note: (act.note || '').trim(), createdAt: Date.now() };
  const done = busy(btn, 'Guardando…');
  try { await store.put('activities', a); } catch (e) { console.error(e); done(); return toast(errMsg(e)); }
  state.sel = a.date; setMonthTo(a.date); state.view = 'cal';
  closeSheet(); render(); toast('Actividad guardada');
}

// --- máquina (foto y ajustes de un ejercicio) ---
function openMachine(name, opts) {
  opts = opts || {};
  const m = name ? machineFor(name) : null;
  mc = { id: m ? m.id : null, name: m ? m.name : (name || ''), settings: m ? (m.settings || '') : '', photoId: m ? (m.photoId || null) : null, photoData: m ? (m.photoData || null) : null,
    nameLocked: !!name, pending: null, preview: null, removePhoto: false, exIndex: opts.exIndex == null ? null : opts.exIndex };
  openSheet2(machineHTML());
}
function machineHTML() {
  const src = mc.preview || (mc.removePhoto ? null : photoSrc(mc));
  const last = mc.name ? lastExercise(mc.name, null) : null;
  return `<div class="sh"><header class="sh-h"><h2>${mc.nameLocked ? esc(mc.name) : 'Nuevo ejercicio'}</h2>${closeBtn('close2')}</header>
<div class="sh-b">
${mc.nameLocked ? '' : `<label class="field"><span>Nombre del ejercicio</span><input list="exlist" data-bind="mname" value="${esc(mc.name)}" placeholder="Prensa de piernas" autocomplete="off"></label>`}
<div class="photo">${src ? `<img src="${esc(src)}" alt="Máquina de ${esc(mc.name)}">` : `<div class="ph">${ico('camera', 32)}<span>Sin foto todavía</span></div>`}</div>
<div class="btnrow" style="margin:0 0 16px"><button class="btn secondary" data-act="pick-photo">${ico('camera', 18)}${src ? 'Cambiar foto' : 'Añadir foto'}</button>${src ? `<button class="btn secondary danger" data-act="rm-photo">Quitar foto</button>` : ''}</div>
<label class="field"><span>Ajustes de la máquina (opcional)</span><input data-bind="msettings" value="${esc(mc.settings)}" placeholder="Asiento 4, respaldo 2" autocomplete="off"></label>
${last ? `<p class="meta">Última vez, ${shortDate(last.session.date)}: ${esc(setsStr(last.ex.sets))}</p>` : ''}
</div>
<footer class="sh-f">${mc.id ? `<button class="btn secondary danger" data-act="del-m">${ico('trash', 18)}</button>` : ''}<button class="btn grow" data-act="save-m">Guardar</button></footer></div>`;
}
function rerenderMachine() { if (!mc || sheet2.hidden) return; const st = sheet2.scrollTop; sheet2.innerHTML = machineHTML(); sheet2.scrollTop = st; }
async function onFile(file) {
  if (!file || !mc) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name || '')) return toast('Elige una imagen');
  toast('Preparando la foto…');
  try {
    const blob = state.mode === 'idb' ? await shrink(file, 1280, 0.82) : await shrink(file, 960, 0.7);
    if (mc.preview) URL.revokeObjectURL(mc.preview);
    mc.pending = blob; mc.preview = URL.createObjectURL(blob); mc.removePhoto = false;
    rerenderMachine();
  } catch (e) { console.error(e); toast('No se pudo leer la foto. Prueba con otra imagen'); }
}
async function saveMachine(btn) {
  const name = (mc.name || '').trim();
  if (!name) return toast('Escribe el nombre del ejercicio');
  const existing = machineFor(name);
  const m = { id: existing ? existing.id : machineId(name), name: existing ? existing.name : name, nameKey: norm(name), settings: (mc.settings || '').trim(),
    photoId: mc.removePhoto ? null : (existing ? existing.photoId || null : null), photoData: mc.removePhoto ? null : (existing ? existing.photoData || null : null), updatedAt: Date.now() };
  const oldPhotoId = existing ? existing.photoId || null : null;
  const done = busy(btn, 'Guardando…');
  try {
    if (mc.pending) {
      if (state.mode === 'idb') { m.photoId = await store.putPhoto(mc.pending); m.photoData = null; }
      else { m.photoData = await blobToDataURL(mc.pending); m.photoId = null; }
    }
    await store.put('machines', m);
    if (state.mode === 'idb' && oldPhotoId && oldPhotoId !== m.photoId) await store.delPhoto(oldPhotoId);
  } catch (e) { console.error(e); done(); return toast(errMsg(e)); }
  const exIndex = mc.exIndex;
  closeSheet2();
  if (ed) { if (exIndex != null && ed.exercises[exIndex] && !ed.exercises[exIndex].name.trim()) ed.exercises[exIndex].name = m.name; rerenderEx(); }
  render(); toast('Guardado');
}
async function deleteMachine(btn) {
  if (!mc.id) return;
  if (!await confirmBox('¿Eliminar la foto y los ajustes de este ejercicio? Las sesiones registradas se conservan.', 'Eliminar')) return;
  const m = machineFor(mc.name);
  const done = busy(btn, 'Eliminando…');
  try {
    await store.remove('machines', mc.id);
    if (state.mode === 'idb' && m && m.photoId) await store.delPhoto(m.photoId);
  } catch (e) { console.error(e); done(); return toast(errMsg(e)); }
  closeSheet2(); rerenderEx(); render(); toast('Eliminado');
}

// --- ajustes y copia de seguridad ---
function openSettings() {
  const nS = state.sessions.length, nA = state.activities.length, nP = store.photoCount(), nF = state.food.length;
  openSheet(`<div class="sh"><header class="sh-h"><h2>Ajustes</h2>${closeBtn('close')}</header>
<div class="sh-b">
<div class="card list" style="margin-bottom:12px"><div class="row"><span class="ic g">${ico('phone')}</span><span class="rt"><b>Datos guardados en este teléfono</b><small>${nS} ${nS === 1 ? 'sesión' : 'sesiones'}, ${nA} ${nA === 1 ? 'actividad' : 'actividades'}, ${nP} ${nP === 1 ? 'foto' : 'fotos'}, ${nF} ${nF === 1 ? 'comida' : 'comidas'}</small></span></div></div>
<p class="meta">Todo vive dentro de la app instalada, sin cuentas ni servidores. Si la desinstalas o cambias de teléfono, los datos se van con ella: guarda una copia de vez en cuando y podrás restaurarla en cualquier dispositivo.</p>
<button class="btn secondary block" data-act="export" style="margin-bottom:8px">${ico('down', 18)}Guardar copia de seguridad</button>
<button class="btn secondary block" data-act="import">${ico('up', 18)}Restaurar desde una copia</button>
${isStandalone() ? '' : `<p class="meta" style="margin-top:18px">Para instalarla: en iPhone, Compartir y "Añadir a pantalla de inicio"; en Android, menú del navegador e "Instalar aplicación".</p>`}
</div></div>`);
}
async function exportData(btn) {
  const done = busy(btn, 'Preparando…');
  try {
    const photos = {};
    if (state.mode === 'idb') { const all = await IDB.getAll('photos'); for (const p of all) if (p.blob) photos[p.id] = await blobToDataURL(p.blob); }
    const data = { app: 'entrenos', version: 2, exportedAt: new Date().toISOString(), photos };
    for (const c of COLS) data[c] = state[c];
    const name = 'entrenos-' + todayISO() + '.json';
    const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Copia de Entrenos' }); done(); return toast('Copia lista'); } catch (e) { if (e && e.name === 'AbortError') { done(); return; } }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    done(); toast('Copia descargada');
  } catch (e) { console.error(e); done(); toast('No se pudo crear la copia'); }
}
async function importData(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch (e) { return toast(errMsg({ message: 'format' })); }
  if (!j || j.app !== 'entrenos' || !Array.isArray(j.sessions)) return toast(errMsg({ message: 'format' }));
  const n = j.sessions.length + (j.activities || []).length + (j.food || []).length;
  if (!await confirmBox(`Restaurar ${n} registros y ${Object.keys(j.photos || {}).length} fotos. Lo que ya tengas se conserva; los registros repetidos se actualizan.`, 'Restaurar')) return;
  toast('Restaurando…');
  try {
    if (state.mode === 'idb') {
      for (const [id, dataUrl] of Object.entries(j.photos || {})) { const blob = await (await fetch(dataUrl)).blob(); await IDB.put('photos', { id, blob }); if (photoURL[id]) URL.revokeObjectURL(photoURL[id]); photoURL[id] = URL.createObjectURL(blob); }
    }
    for (const c of COLS) for (const it of (j[c] || [])) {
      if (!it || !it.id) continue;
      if (state.mode === 'local' && c === 'machines' && it.photoId && j.photos && j.photos[it.photoId]) { it.photoData = j.photos[it.photoId]; it.photoId = null; }
      if (state.mode === 'idb') await IDB.put(c, it);
      const arr = state[c], i = arr.findIndex(x => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it);
    }
    if (state.mode === 'local') saveLocal();
    reindex(); closeSheet(); render(); toast('Copia restaurada');
  } catch (e) { console.error(e); toast(errMsg(e)); }
}

// ---------- eventos ----------
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'sel') { state.sel = b.dataset.date; setMonthTo(state.sel); render(); }
  else if (a === 'prev') moveMonth(-1);
  else if (a === 'next') moveMonth(1);
  else if (a === 'today') { const t = todayISO(); state.sel = t; setMonthTo(t); render(); }
  else if (a === 'new-s') routinePicker(state.sel);
  else if (a === 'new-a') openActivity({ date: state.sel });
  else if (a === 'edit-s') { const s = state.sessions.find(x => x.id === b.dataset.id); if (s) openEditor(s); }
  else if (a === 'edit-a') { const x = state.activities.find(x => x.id === b.dataset.id); if (x) openActivity(x); }
  else if (a === 'metric') { state.progMetric = b.dataset.m; render(); }
  else if (a === 'open-m') openMachine(b.dataset.name);
  else if (a === 'new-m') openMachine('');
  else if (a === 'settings') openSettings();
  else if (a === 'open-food' || a === 'add-food') { state.mday = b.dataset.date; state.view = 'mac'; state.mv = a === 'add-food' ? 'add' : 'hoy'; render(); window.scrollTo(0, 0); }
  else if (a === 'goals') openGoals();
  else if (a === 'mv') { state.mv = b.dataset.v; render(); }
  else if (a === 'mday') { const d = fromISO(state.mday); d.setDate(d.getDate() + (+b.dataset.d)); state.mday = toISO(d); render(); }
  else if (a === 'mday-today') { state.mday = todayISO(); render(); }
  else if (a === 'meal') { state.meal = b.dataset.m; render(); }
  else if (a === 'reg') { const i = +b.dataset.i, o = PLAN[state.meal][i], t = optTotal(state.meal, i); const base = o.n.replace(/^\d+\s·\s/, ''); addFood({ name: norm(base).startsWith(norm(state.meal)) ? base : state.meal + ' · ' + base, k: t.k, p: t.p, f: t.f, c: t.c, fi: t.fi }); }
  else if (a === 'qadd') { const k = parseN(($('#qK') || {}).value); if (!(k > 0)) { toast('Pon al menos las calorías'); return; } addFood({ name: (($('#qName') || {}).value || '').trim() || 'Comida fuera', k, p: parseN(($('#qP') || {}).value), f: parseN(($('#qF') || {}).value), c: parseN(($('#qC') || {}).value), fi: 0 }); }
  else if (a === 'fdel') store.remove('food', b.dataset.id).catch(err => toast(errMsg(err)));
  else if (a === 'fclear') { confirmBox('¿Vaciar todo lo registrado este día?', 'Vaciar').then(async ok => { if (!ok) return; for (const x of (idx.f[state.mday] || []).slice()) await store.remove('food', x.id, true); if (state.mode === 'local') saveLocal(); reindex(); render(); }); }
  else if (a === 'dismiss-install') { try { localStorage.setItem('entrenos_install', '1'); } catch (err) {} render(); }
  else if (a === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(() => { installEvt = null; render(); }); } }
});
$('#view').addEventListener('change', e => {
  if (e.target.id === 'exsel') { state.progEx = e.target.value; render(); return; }
  if (e.target.dataset.gsel) { const i = +e.target.dataset.i, gi = +e.target.dataset.gi, key = state.meal + '|' + i; const sel = (state.gsel[key] = state.gsel[key] || []); sel[gi] = +e.target.value; const el = $(`.opt[data-opt="${i}"] .mac`); if (el) el.textContent = macLine(optTotal(state.meal, i)); }
});
$('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.view = b.dataset.view; render(); window.scrollTo(0, 0); });

sheet.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.ex, j = +b.dataset.set;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'pick-r': startSession(b.dataset.r); break;
    case 'pick-new': { const el = $('#newr'); const v = el ? el.value.trim() : ''; if (!v) { toast('Escribe un nombre para la rutina'); if (el) el.focus(); return; } startSession(v); break; }
    case 'step': step(i, j, b.dataset.f, +b.dataset.d); break;
    case 'addset': { const sets = ed.exercises[i].sets, p = sets[sets.length - 1]; sets.push(p ? { reps: p.reps, weight: p.weight } : { reps: 10, weight: 0 }); rerenderEx(i); break; }
    case 'delset': ed.exercises[i].sets.splice(j, 1); rerenderEx(i); break;
    case 'delex': ed.exercises.splice(i, 1); rerenderEx(); break;
    case 'addex': ed.exercises.push({ name: '', sets: [{ reps: 10, weight: 0 }] }); rerenderEx(); focusLastName(); break;
    case 'machine': { const name = (ed.exercises[i].name || '').trim(); if (!name) { toast('Escribe primero el nombre del ejercicio'); return; } openMachine(name, { exIndex: i }); break; }
    case 'save-s': saveSession(b); break;
    case 'del-s': if (await confirmBox('¿Eliminar esta sesión?', 'Eliminar')) { try { await store.remove('sessions', ed.id); } catch (err) { return toast(errMsg(err)); } closeSheet(); render(); toast('Sesión eliminada'); } break;
    case 'type': act.type = b.dataset.t; sheet.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.t === act.type)); break;
    case 'save-a': saveActivity(b); break;
    case 'del-a': if (await confirmBox('¿Eliminar esta actividad?', 'Eliminar')) { try { await store.remove('activities', act.id); } catch (err) { return toast(errMsg(err)); } closeSheet(); render(); toast('Actividad eliminada'); } break;
    case 'export': exportData(b); break;
    case 'goals-save': saveGoals(b); break;
    case 'import': { const f = $('#importfile'); f.value = ''; f.click(); break; }
  }
});
sheet.addEventListener('input', e => {
  const el = e.target, k = el.dataset.bind; if (!k) return;
  const i = +el.dataset.ex, j = +el.dataset.set;
  if (ed) {
    if (k === 'routine') ed.routine = el.value;
    else if (k === 'date') ed.date = el.value;
    else if (k === 'name') ed.exercises[i].name = el.value;
    else if (k === 'reps') ed.exercises[i].sets[j].reps = Math.max(0, Math.round(parseN(el.value)));
    else if (k === 'weight') ed.exercises[i].sets[j].weight = Math.max(0, parseN(el.value));
  } else if (act) {
    if (k === 'date') act.date = el.value;
    else if (k === 'minutes') act.minutes = Math.max(0, Math.round(parseN(el.value)));
    else if (k === 'note') act.note = el.value;
  }
});
sheet.addEventListener('change', e => {
  const el = e.target, k = el.dataset.bind; if (!k || !ed) return;
  const i = +el.dataset.ex, j = +el.dataset.set;
  if (k === 'weight') el.value = fmtN(ed.exercises[i].sets[j].weight);
  else if (k === 'reps') el.value = String(ed.exercises[i].sets[j].reps);
  else if (k === 'name') {
    const ex = ed.exercises[i], last = lastExercise(ex.name, ed.id);
    const untouched = ex.sets.length <= 1 && ex.sets.every(s => !s.weight);
    if (last && untouched) ex.sets = clone(last.ex.sets);
    rerenderEx(i);
  }
});
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newr') { e.preventDefault(); const b = sheet.querySelector('[data-act="pick-new"]'); if (b) b.click(); } });

sheet2.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !mc) return;
  const a = b.dataset.act;
  if (a === 'close2') closeSheet2();
  else if (a === 'pick-photo') { const f = $('#file'); f.value = ''; f.click(); }
  else if (a === 'rm-photo') { if (mc.preview) URL.revokeObjectURL(mc.preview); mc.pending = null; mc.preview = null; mc.removePhoto = true; rerenderMachine(); }
  else if (a === 'save-m') saveMachine(b);
  else if (a === 'del-m') deleteMachine(b);
});
sheet2.addEventListener('input', e => {
  const el = e.target, k = el.dataset.bind; if (!k || !mc) return;
  if (k === 'mname') mc.name = el.value;
  else if (k === 'msettings') mc.settings = el.value;
});
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; onFile(f); });
$('#importfile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importData(f); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!sheet2.hidden) closeSheet2(); else if (!sheet.hidden) closeSheet(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state.view === 'cal') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Instalada'); render(); });

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err)); }); }
store.init();
})();
</script>
</body>
</html>
